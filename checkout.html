
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pembayaran - Saka Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
        }

        header {
            background: #050505;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 25px 20px;
        }

        .checkout-box {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 20px;
        }

        .checkout-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .section {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: #ccc;
        }
        .whatsapp-note {
    font-size: 10px;
    color: #999;
    margin-top: 6px;
    font-style: italic;        
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #292929;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .product-card {
    display: block;
    padding: 15px;
    margin-bottom: 25px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 15px;
    overflow: hidden;
        }

.product-image {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 10px;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    flex: 1;
    padding-top: 8px;
}

.product-info .product-name {
    margin-bottom: 6px;
}
       
        
        .product-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .price {
            color: #ffd000;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .stock {
    font-size: 12px;
    color: #999;
    margin-top: 0px;
        }

        .buy-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ffd000;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-button:hover {
            background: #ffdf45;
        }

        .note {
            margin-top: 12px;
            color: #999;
            font-size: 13px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1 style="color: #ffd000;">SAKASTORE.ID</h1>
</header>

<main class="container">

    <div class="checkout-box">

        <div class="checkout-title">
            Pembayaran
        </div>

        <div class="product-card">

    <div class="product-image">
        <img id="productImage" src="advance-server-lvl-3.jpg" alt="Advance Server LVL 3">
    </div>

    <div class="product-info">
        <div class="product-name">
            Advance Server LVL 3
        </div>

        <div class="price">
            Rp2.000
        </div>

        <div class="stock">
            Stok tersedia
        </div>
    </div>

        </div>

        <div class="section">
            <label>Nomor WhatsApp</label>

            <input
                type="tel"
                placeholder="Masukkan Nomor WhatsApp Anda"
            >
            <div class="whatsapp-note">
    *Pastikan nomor Anda aktif dan benar.
            </div>
        </div>

        <div class="section">
            <label>Kode Promo</label>

            <input
                type="text"
                placeholder="Masukkan Kode Promo (Jika Ada)"
            >
        </div>

        <div class="section">
            <label>Metode Pembayaran</label>

            <select>
                <option value="">Pilih Metode Pembayaran</option>
                <option value="qris">QRIS</option>
    <option value="dana">DANA</option>
    <option value="gopay">GoPay</option>
                
            </select>
        </div>

        <div class="section">

            <button class="buy-button">
                LANJUTKAN PEMBAYARAN
            </button>

            <div class="note">
                Pastikan nomor WhatsApp dan metode pembayaran
                yang Anda pilih sudah benar.
            </div>

        </div>

    </div>

</main>

<footer>
    © 2026 Saka Store<br>
    Layanan digital terpercaya
</footer>
<script>
document.querySelector('.buy-button').addEventListener('click', function() {

    const whatsapp = document.querySelector('input[type="tel"]').value.trim();
    const payment = document.querySelector('select').value;

    if (whatsapp === "") {
        alert("Silakan masukkan nomor WhatsApp Anda.");
        return;
    }

    if (payment === "") {
        alert("Silakan pilih metode pembayaran.");
        return;
    }

    const productName = document.querySelector('.product-name')?.textContent.trim() || "Produk";
    const productPrice = document.querySelector('.price')?.textContent.trim() || "Rp0";
    const productImage = document.querySelector('.product-image img')?.src || "";

    const modal = document.createElement('div');

    modal.innerHTML = `
        <div class="confirmation-overlay">

            <div class="confirmation-modal">

                <button class="close-modal">×</button>

                <h2>🎮 Konfirmasi Pembelian</h2>
                <p class="modal-subtitle">Pastikan data pembelian Anda sudah benar.</p>

                <div class="modal-product">

                    <img src="${productImage}" alt="${productName}">

                    <div class="modal-product-info">
                        <h3>${productName}</h3>
                        <div class="modal-price">${productPrice}</div>
                        <div class="modal-stock">✓ Stok tersedia</div>
                    </div>

                </div>

                <div class="detail-title">DETAIL PEMBELIAN</div>

                <div class="detail-row">
                    <span>👤 Jenis Akun</span>
                    <strong>${productName}</strong>
                </div>

                <div class="detail-row">
                    <span>💵 Harga Produk</span>
                    <strong>${productPrice}</strong>
                </div>

                <div class="detail-row">
                    <span>💳 Pembayaran</span>
                    <strong>${payment.toUpperCase()}</strong>
                </div>

                <div class="detail-row">
                    <span>📱 WhatsApp</span>
                    <strong>${whatsapp}</strong>
                </div>

                <div class="total-row">
                    <span>Total Bayar</span>
                    <strong>${productPrice}</strong>
                </div>

                <div class="warning-box">
                    ⚠️ <strong>Perhatian:</strong><br>
                    Pastikan nomor WhatsApp dan data pembelian sudah benar.
                    Pesanan yang sudah diproses tidak dapat dikembalikan.
                </div>

                <div class="modal-buttons">

                    <button class="cancel-button">
                        ✕ BATAL
                    </button>

                    <button class="confirm-button">
                        ✓ YA, BAYAR
                    </button>

                </div>

            </div>

        </div>
    `;

    document.body.appendChild(modal);

    const style = document.createElement('style');

    style.textContent = `

        .confirmation-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 99999;
            overflow-y: auto;
        }

        .confirmation-modal {
            width: 100%;
            max-width: 520px;
            background: #171717;
            color: white;
            border: 1px solid #333;
            border-radius: 24px;
            padding: 24px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,.6);
        }

        .close-modal {
            position: absolute;
            right: 18px;
            top: 14px;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: #292929;
            color: #fff;
            font-size: 25px;
            cursor: pointer;
        }

        .confirmation-modal h2 {
            text-align: center;
            font-size: 25px;
            margin: 5px 35px 5px;
        }

        .modal-subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-product {
            background: #222;
            border: 1px solid #333;
            border-radius: 18px;
            padding: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-product img {
            width: 105px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
        }

        .modal-product-info h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .modal-price {
            color: #ffd000;
            font-size: 20px;
            font-weight: bold;
        }

        .modal-stock {
            color: #aaa;
            margin-top: 5px;
            font-size: 13px;
        }

        .detail-title {
            font-size: 14px;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 5px;
            letter-spacing: .5px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #333;
            font-size: 15px;
        }

        .detail-row span {
            color: #aaa;
        }

        .detail-row strong {
            text-align: right;
            color: #fff;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 18px 0;
            font-size: 19px;
            font-weight: bold;
        }

        .total-row strong {
            color: #ffd000;
        }

        .warning-box {
            background: #fff8d9;
            color: #946c00;
            border-radius: 16px;
            padding: 15px;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            min-height: 52px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-button {
            background: #292929;
            color: #fff;
        }

        .confirm-button {
            background: #ffd000;
            color: #111;
        }

        .cancel-button:active,
        .confirm-button:active {
            transform: scale(.98);
        }

        @media (max-width: 480px) {

            .confirmation-overlay {
                padding: 12px;
            }

            .confirmation-modal {
                padding: 20px;
                border-radius: 20px;
            }

            .confirmation-modal h2 {
                font-size: 21px;
            }

            .modal-product img {
                width: 90px;
                height: 70px;
            }

            .detail-row {
                font-size: 13px;
            }

        }

    `;

    document.head.appendChild(style);

    const closeModal = () => {
        modal.remove();
        style.remove();
    };

    modal.querySelector('.close-modal').addEventListener('click', closeModal);

    modal.querySelector('.cancel-button').addEventListener('click', closeModal);

    modal.querySelector('.confirm-button').addEventListener('click', function() {

        alert(
            "Konfirmasi berhasil!\n\n" +
            "Produk: " + productName + "\n" +
            "WhatsApp: " + whatsapp + "\n" +
            "Pembayaran: " + payment.toUpperCase()
        );

    });

});
</script>
</body>
              </html>
