<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pembayaran - Saka Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
        }

        header {
            background: #050505;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 25px 20px;
        }

        .checkout-box {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 20px;
        }

        .checkout-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .section {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: #ccc;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #292929;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .product-card {
    display: block;
    padding: 15px;
    margin-bottom: 25px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 15px;
    overflow: hidden;
        }

.product-image {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 10px;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    flex: 1;
}

.product-info .product-name {
    margin-bottom: 6px;
}
       
        
        .product-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .price {
            color: #ffd000;
            font-size: 22px;
            font-weight: bold;
        }

        .buy-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ffd000;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-button:hover {
            background: #ffdf45;
        }

        .note {
            margin-top: 12px;
            color: #999;
            font-size: 13px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1 style="color: #ffd000;">SAKASTORE.ID</h1>
</header>

<main class="container">

    <div class="checkout-box">

        <div class="checkout-title">
            Pembayaran
        </div>

        <div class="product-card">

    <div class="product-image">
        <img id="productImage" src="advance-server-lvl-3.jpg" alt="Advance Server LVL 3">
    </div>

    <div class="product-info">
        <div class="product-name">
            Advance Server LVL 3
        </div>

        <div class="price">
            Rp2.000
        </div>

        <div class="stock">
            Stok tersedia
        </div>
    </div>

        </div>

        <div class="section">
            <label>Nomor WhatsApp</label>

            <input
                type="tel"
                placeholder="Masukkan Nomor WhatsApp Anda"
            >
        </div>

        <div class="section">
            <label>Kode Promo</label>

            <input
                type="text"
                placeholder="Masukkan Kode Promo (Jika Ada)"
            >
        </div>

        <div class="section">
            <label>Metode Pembayaran</label>

            <select>
                <option value="">Pilih Metode Pembayaran</option>
                <option>QRIS</option>
                <option>DANA</option>
                <option>GoPay</option>
                
            </select>
        </div>

        <div class="section">

            <button class="buy-button">
                LANJUTKAN PEMBAYARAN
            </button>

            <div class="note">
                Pastikan nomor WhatsApp dan metode pembayaran
                yang Anda pilih sudah benar.
            </div>

        </div>

    </div>

</main>

<footer>
    © 2026 Saka Store<br>
    Layanan digital terpercaya
</footer>

</body>
              </html>
