<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saka Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            background: #050505;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .logo {
    display: flex;
    align-items: center;
}

.indonesia-flag {
    width: 38px;
    height: 25px;
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid #333;
}

.flag-red {
    width: 100%;
    height: 50%;
    background: #e60000;
}

.flag-white {
    width: 100%;
    height: 50%;
    background: #ffffff;
}

        .menu {
            font-size: 28px;
            cursor: pointer;
        }

        .hero {
            padding: 45px 20px;
            text-align: center;
            background: linear-gradient(135deg, #111827, #050505);
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #aaa;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .product {
            background: #171717;
            border: 1px solid #292929;
            border-radius: 15px;
            overflow: hidden;
        }

        .product-image {
            height: 170px;
            background: linear-gradient(135deg, #26364d, #111827);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #ffd000;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stock {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .buy-button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;
            background: #ffd000;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-button:hover {
            background: #ffdf45;
        }

        footer {
            margin-top: 40px;
            padding: 35px 20px;
            background: #050505;
            text-align: center;
            color: #888;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <div class="indonesia-flag">
            <div class="flag-red"></div>
            <div class="flag-white"></div>
        </div>
    </div>

    <div class="menu">☰</div>
</header>

<section class="hero">
    <h1>Selamat Datang di Saka Store</h1>
    <p>
        Tempat membeli berbagai produk digital
        dengan proses cepat dan mudah.
    </p>
</section>

<main class="container">

    <h2 class="section-title">Produk Terlaris</h2>

    <div class="products">

        <div class="product">

            <div class="product-image">
                <img src="Screenshot_2026-09-01-19-12-50-100_com.mobile.legends.jpg" alt="Advance Server LVL 3">
            </div>

            <div class="product-info">

                <h3>Advance Server LVL 3</h3>

                <div class="price">
                    Rp2.000
                </div>

                <div class="stock">
                    Stok tersedia
                </div>

                <button class="buy-button"
                    onclick="beliProduk('Advance Server LVL 3', '2000')">
                    BELI SEKARANG
                </button>

            </div>

        </div>


        <div class="product">

            <div class="product-image">
                🎮
            </div>

            <div class="product-info">

                <h3>Advance Server LVL 3 (2 Server)</h3>

                <div class="price">
                    Rp12.000
                </div>

                <div class="stock">
                    Stok tersedia
                </div>

                <button class="buy-button"
                    onclick="alert('Fitur pembelian akan kita buat pada tahap berikutnya.')">
                    BELI SEKARANG
                </button>

            </div>

        </div>

    </div>

</main>

<footer>
    <p>© 2026 Saka Store</p>
    <p style="margin-top:10px;">
        Layanan digital terpercaya
    </p>
</footer>

<script>
    function beliProduk(namaProduk, hargaProduk) {
    let nomorWhatsApp = prompt("Masukkan nomor WhatsApp Anda:");

    if (nomorWhatsApp === null || nomorWhatsApp.trim() === "") {
        alert("Nomor WhatsApp wajib diisi.");
        return;
    }

    alert(
        "Pesanan berhasil dicatat!\n\n" +
        "Produk: " + namaProduk + "\n" +
        "Harga: Rp" + hargaProduk + "\n" +
        "WhatsApp: " + nomorWhatsApp
    );
    }

</script>

</body>
</html>
